<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result calculator</title>
    <Link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h2>Students Result Calculator</h2>

        <label for="name">Student Name</label>
        <input type="text" id="name" placeholder="Enter students name">

        <label for="englisg">English</label>
        <input type="number" id="english" placeholder="Enter english score">

        <label for="math">Mathematics</label>
        <input type="number" id="math" placeholder="Enter mathematics score">

        <label for="computer">Computer Science</label>
        <input type="number" id="computer" placeholder="Enter computer science score">

        <label for="physics">Physics</label>
        <input type="number" id="physics" placeholder="Enter physics score">
<br>
        <button id="calculateBtn">Calculate Result</button>
        <button id="clearBtn">ClearForm</button>
      <div id="result">

      </div>
    </div>
</body>
<script src="script.js"></script>
</html>
